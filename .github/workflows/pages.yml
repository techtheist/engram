name: Site (GitHub Pages)

# Publishes https://techtheist.github.io/engram/: the documentation site
# (website/, built from docs/, CHANGELOG.md and SECURITY.md) at the root, and
# the browser-only pane demo (frontend/demo/) at /demo/ — the real pane
# running against a mock daemon that lives in the visitor's tab. Nothing here
# touches the release artifacts: the demo builds to dist-demo/, never dist/.
#
# One-time setup in the repo: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'website/**'
      - 'docs/**'
      - '.screenshots/**'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer commit supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: frontend

      # The demo mock must satisfy the same EngramApi the HTTP client defines,
      # so this is the check that catches a demo drifting from the product.
      - name: Type-check
        run: bun run type-check
        working-directory: frontend

      - name: Build
        run: bun run build:demo
        working-directory: frontend

      - name: Install the docs site
        run: bun install --frozen-lockfile
        working-directory: website

      # Fails on a dead internal link, so a broken docs link fails the deploy.
      - name: Build the docs site
        run: bun run build
        working-directory: website

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -R website/.vitepress/dist/. site/
          mkdir -p site/demo
          cp -R frontend/dist-demo/. site/demo/
          # Pages runs Jekyll otherwise, which drops files it dislikes.
          touch site/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
